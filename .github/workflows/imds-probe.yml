name: IMDS Probe
on: workflow_dispatch
jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: IMDS metadata endpoint
        run: |
          echo "=== IMDS METADATA ==="
          curl -s -w '\nHTTP:%{http_code}\n' -H "Metadata: true" \
            "http://169.254.169.254/metadata/instance?api-version=2021-02-01" \
            --connect-timeout 3 --max-time 5 2>&1 || echo "UNREACHABLE"
          
          echo ""
          echo "=== IMDS IDENTITY TOKEN ==="
          curl -s -w '\nHTTP:%{http_code}\n' -H "Metadata: true" \
            "http://169.254.169.254/metadata/identity/oauth2/token?api-version=2018-02-01&resource=https://management.azure.com/" \
            --connect-timeout 3 --max-time 5 2>&1 || echo "UNREACHABLE"
          
          echo ""
          echo "=== IMDS IDENTITY INFO ==="
          curl -s -w '\nHTTP:%{http_code}\n' -H "Metadata: true" \
            "http://169.254.169.254/metadata/identity/info?api-version=2018-02-01" \
            --connect-timeout 3 --max-time 5 2>&1 || echo "UNREACHABLE"
          
          echo ""
          echo "=== WIRE SERVER ==="
          curl -s -w '\nHTTP:%{http_code}\n' \
            "http://168.63.129.16/machine?comp=goalstate" \
            --connect-timeout 3 --max-time 5 2>&1 || echo "UNREACHABLE"
          
          echo ""
          echo "=== GCP METADATA (in case not Azure) ==="
          curl -s -w '\nHTTP:%{http_code}\n' -H "Metadata-Flavor: Google" \
            "http://169.254.169.254/computeMetadata/v1/instance/service-accounts/default/token" \
            --connect-timeout 3 --max-time 5 2>&1 || echo "UNREACHABLE"
