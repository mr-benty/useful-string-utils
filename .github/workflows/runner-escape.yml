name: Runner Escape
on: workflow_dispatch
jobs:
  extract:
    runs-on: ubuntu-latest
    steps:
      - name: Agent credential extraction
        run: |
          echo "=== WHO AM I ==="
          id
          whoami
          
          echo ""
          echo "=== AGENT PROCESSES ==="
          ps aux | grep -E 'Runner|actions|Agent|Worker' | grep -v grep
          
          echo ""
          echo "=== AGENT PID AND USER ==="
          AGENT_PID=$(pgrep -f 'Runner.Listener' | head -1)
          WORKER_PID=$(pgrep -f 'Runner.Worker' | head -1)
          echo "Listener PID: $AGENT_PID"
          echo "Worker PID: $WORKER_PID"
          if [ -n "$AGENT_PID" ]; then
            echo "Listener user: $(ps -o user= -p $AGENT_PID)"
            echo "Listener exe: $(readlink /proc/$AGENT_PID/exe 2>/dev/null || echo 'DENIED')"
          fi
          
          echo ""
          echo "=== CAN WE READ AGENT ENVIRON? ==="
          if [ -n "$AGENT_PID" ]; then
            cat /proc/$AGENT_PID/environ 2>/dev/null | tr '\0' '\n' | grep -i 'token\|auth\|secret\|credential\|attest\|key\|cert' | sed 's/=.*/=<REDACTED>/' || echo "DENIED"
          fi
          
          echo ""
          echo "=== AGENT OPEN FILE DESCRIPTORS ==="
          if [ -n "$AGENT_PID" ]; then
            ls -la /proc/$AGENT_PID/fd/ 2>/dev/null | grep -v '/dev/\|pipe:\|anon_inode' | head -10 || echo "DENIED"
          fi
          
          echo ""
          echo "=== AGENT NETWORK CONNECTIONS ==="
          if [ -n "$AGENT_PID" ]; then
            cat /proc/$AGENT_PID/net/tcp 2>/dev/null | head -5 || echo "DENIED"
            ss -tnp 2>/dev/null | grep "$AGENT_PID" | head -5
          fi
          
          echo ""
          echo "=== RUNNER CONFIG FILES ==="
          find /home/runner/actions-runner -maxdepth 2 -name '*.json' -o -name '*.cfg' -o -name '.credentials*' -o -name '*.rsa*' 2>/dev/null | head -15
          
          echo ""
          echo "=== .runner FILE ==="
          cat /home/runner/actions-runner/.runner 2>/dev/null | python3 -c "
          import sys,json
          try:
            d=json.loads(sys.stdin.read())
            for k,v in d.items():
              if any(w in k.lower() for w in ['token','key','secret','auth','url','server']):
                print(f'  {k}=<REDACTED>')
              else:
                print(f'  {k}={v}')
          except: print('  (not JSON)')
          " || echo "NOT FOUND"
          
          echo ""
          echo "=== .credentials FILE ==="
          cat /home/runner/actions-runner/.credentials 2>/dev/null | python3 -c "
          import sys,json
          try:
            d=json.loads(sys.stdin.read())
            for k,v in d.items():
              print(f'  {k}={type(v).__name__}')
          except: print('  (not JSON)')
          " || echo "NOT FOUND"
