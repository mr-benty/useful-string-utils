name: Confirm Architecture
on: workflow_dispatch
jobs:
  confirm:
    runs-on: ubuntu-latest
    steps:
      - name: Identify agent connection target and check orchestrator DNS
        run: |
          echo "=== AGENT CONNECTION TARGET: TLS CERT ==="
          echo | openssl s_client -connect 20.85.130.105:443 -servername pipelines.actions.githubusercontent.com 2>/dev/null | openssl x509 -noout -subject -issuer -ext subjectAltName 2>/dev/null || echo "CERT_FAILED"
          
          echo ""
          echo "=== REVERSE DNS ==="
          dig -x 20.85.130.105 +short 2>/dev/null || host 20.85.130.105 2>/dev/null || echo "NO_RDNS"
          
          echo ""
          echo "=== DOES THE AGENT EVER RESOLVE AN ORCHESTRATOR HOST? ==="
          # Check if any orchestrator hostname resolves from inside the runner
          for HOST in \
            hosted-compute-request-orchestrator-prod-eus-01.githubapp.com \
            hosted-compute-request-orchestrator-prod-eus-02.githubapp.com \
            hosted-compute-request-orchestrator-prod-iad-01.githubapp.com; do
            IP=$(dig +short "$HOST" 2>/dev/null | head -1)
            echo "  $HOST -> ${IP:-NXDOMAIN}"
          done
          
          echo ""
          echo "=== AGENT CONNECTIONS OVER JOB LIFETIME ==="
          AGENT_PID=$(pgrep -f 'Runner.Listener' | head -1)
          if [ -n "$AGENT_PID" ]; then
            ss -tnp 2>/dev/null | grep "$AGENT_PID"
          fi
          
          echo ""
          echo "=== /etc/hosts ==="
          grep -v '^#' /etc/hosts | grep -v '^$'
